[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally NOT set here -- app/db.py's init_db()
# injects it at runtime from Settings.database_url (which itself comes from
# the DATABASE_URL env var), and alembic/env.py falls back to the same env
# var when Alembic is run from the CLI directly (`alembic upgrade head`).
# This avoids checking a database URL (potentially containing credentials
# via a query string) into version control.

version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
