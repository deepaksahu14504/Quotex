# Local/staging convenience stack: PostgreSQL + the backend.
#
# This does NOT replace your existing deployment method (DEPLOYMENT.md) --
# it exists so `docker compose up` gives you a working Postgres instance
# without installing it on the host, matching the DATABASE_URL default in
# backend/.env.example. The backend still runs as ONE process (see
# DEPLOYMENT.md's "run exactly ONE backend process" note) — that constraint
# is about the in-memory Orchestrator/websocket-hub registry, not the
# database, and moving to Postgres does not lift it.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qat_app
      POSTGRES_PASSWORD: qat_app
      POSTGRES_DB: qat
    volumes:
      - qat_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qat_app -d qat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # RCA F2: the context used to be ./backend, which cannot see the
      # repo-root vendor/ directory. That made the vendored pyquotex broker
      # library impossible to COPY into the image, so every real Quotex
      # connection failed with ModuleNotFoundError inside the container while
      # the systemd deployment next door worked fine. The context is now the
      # repository root and backend/Dockerfile selects what it copies.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://qat_app:qat_app@db:5432/qat
      HOST: 0.0.0.0
      PORT: "8090"
    env_file:
      - ./backend/.env
    ports:
      - "8090:8090"
    volumes:
      # Non-DB state only (per-user JSON persistence under engine/services).
      # The in-image path moved from /app/data to /app/backend/data because
      # config.DATA_DIR is resolved as <dir containing the app package>/data,
      # and the package moved from /app to /app/backend.
      - ./backend/data:/app/backend/data

volumes:
  qat_pgdata:
